# Compose wiring. The api service runs by default with a SQLite result
# store on a named volume. The "db" profile starts postgres for the
# PostgreSQL result store (Phase 11+): run with
#   docker compose --profile db up
# and point the api at it via
#   CT_STORAGE__BACKEND=postgresql
#   CT_STORAGE__URL=postgresql://contexttrading:contexttrading@postgres:5432/contexttrading
# (requires the optional psycopg driver in the image). redis stays behind
# the "later" profile until a cache consumer lands.

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      CT_API__HOST: 0.0.0.0
      CT_API__PORT: "8000"
      CT_API__API_KEYS: ${CT_API__API_KEYS:-dev-key}
      CT_AI__PROVIDER: ${CT_AI__PROVIDER:-none}
      CT_STORAGE__URL: sqlite:////data/results.db
    volumes:
      - apidata:/data

  postgres:
    image: postgres:16-alpine
    profiles: ["db"]
    environment:
      POSTGRES_USER: contexttrading
      POSTGRES_PASSWORD: contexttrading
      POSTGRES_DB: contexttrading
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["later"]

volumes:
  apidata:
  pgdata:
