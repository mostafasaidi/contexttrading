[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contexttrading"
version = "1.0.0"
description = "Deterministic Smart Money Concepts analysis engine: structure, liquidity, FVG, order blocks, sessions, MTF confluence, chart payloads, backtesting, and an explain-only AI layer."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ContextTrading Contributors" }]
keywords = [
    "trading",
    "smart-money-concepts",
    "smc",
    "market-structure",
    "order-blocks",
    "fair-value-gap",
    "backtesting",
    "deterministic",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
requires-python = ">=3.12"
# Library-sane pins: lower bounds only. The core engine is pydantic-only;
# the API, HTTP AI providers, and the PostgreSQL store are extras (their
# imports are lazy, so the core package works without them).
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
ai = ["httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.98",
    "ruff>=0.4",
    "black>=24.0",
    "pre-commit>=3.6",
]
all = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
]

[project.urls]
Homepage = "https://github.com/contexttrading/contexttrading"
Documentation = "https://github.com/contexttrading/contexttrading/tree/main/docs"
Repository = "https://github.com/contexttrading/contexttrading"
Issues = "https://github.com/contexttrading/contexttrading/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# Non-Python resources loaded via __file__ at runtime: AI prompt markdown,
# the reference chart frontend, and the typing marker.
[tool.setuptools.package-data]
contexttrading = [
    "py.typed",
    "ai/prompts/*.md",
    "visualization/frontend/*",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B008"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: performance benchmark tests",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["src/contexttrading"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
