<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ContextTrading Chart</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; background: #131722; color: #d1d4dc; }
    header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid #2a2e39; flex-wrap: wrap; }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; }
    header .meta { font-size: 12px; opacity: 0.7; }
    #main { display: flex; flex: 1; min-height: 0; }
    #sidebar { width: 220px; overflow-y: auto; border-right: 1px solid #2a2e39; padding: 8px 10px; font-size: 12px; }
    #sidebar label { display: flex; gap: 6px; align-items: center; padding: 2px 0; cursor: pointer; }
    #sidebar .count { opacity: 0.55; margin-left: auto; }
    #chart-wrap { position: relative; flex: 1; min-width: 0; }
    #chart { position: absolute; inset: 0; }
    #overlay { position: absolute; inset: 0; pointer-events: none; }
    #tip { position: absolute; display: none; pointer-events: none; background: rgba(19, 23, 34, 0.95);
           border: 1px solid #2a2e39; border-radius: 4px; padding: 6px 8px; font-size: 11px;
           max-width: 260px; z-index: 10; white-space: pre-line; }
    body.light { background: #ffffff; color: #131722; }
    body.light header, body.light #sidebar { border-color: #e0e3eb; }
    body.light #tip { background: rgba(255, 255, 255, 0.95); border-color: #e0e3eb; }
    input[type="file"] { font-size: 11px; max-width: 200px; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">ContextTrading</h1>
    <span class="meta" id="meta">loading payload...</span>
    <span style="flex:1"></span>
    <label class="meta">load payload <input type="file" id="file" accept=".json" /></label>
  </header>
  <div id="main">
    <div id="sidebar"></div>
    <div id="chart-wrap">
      <div id="chart"></div>
      <canvas id="overlay"></canvas>
      <div id="tip"></div>
    </div>
  </div>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="app.js"></script>
</body>
</html>
